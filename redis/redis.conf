# DomainRadar Redis Configuration
# Used for queue processing (WHOIS worker) and caching

# ============================================================
# PERSISTENCE - Append Only File (AOF)
# ============================================================
# Enable AOF persistence for durability of queue data
appendonly yes

# Sync AOF to disk every second (good balance of performance and durability)
appendfsync everysec

# Disable automatic AOF rewrite during BGSAVE to avoid latency spikes
no-appendfsync-on-rewrite no

# Trigger AOF rewrite when file grows by 100% and is at least 64MB
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================================================
# MEMORY MANAGEMENT
# ============================================================
# Maximum memory limit (overridable via docker-compose env/command)
maxmemory 256mb

# Eviction policy: remove least recently used keys when memory is full
maxmemory-policy allkeys-lru

# Sample 5 keys for LRU approximation (default, good balance)
maxmemory-samples 5

# ============================================================
# NETWORKING
# ============================================================
# Bind to all interfaces (container networking)
bind 0.0.0.0

# Disable protected mode (container network provides isolation)
protected-mode no

# Default port
port 6379

# TCP keepalive for detecting dead connections (seconds)
tcp-keepalive 300

# Close idle client connections after 0 seconds (0 = disabled)
timeout 0

# ============================================================
# GENERAL
# ============================================================
# Run as a daemon: no (foreground for Docker)
daemonize no

# Log level
loglevel notice

# Log to stdout for Docker log collection
logfile ""

# Number of databases
databases 16

# ============================================================
# SNAPSHOTTING (RDB) - as backup alongside AOF
# ============================================================
# Save RDB snapshot as secondary backup
save 900 1
save 300 10
save 60 10000

# Stop writes on RDB save error
stop-writes-on-bgsave-error yes

# Compress RDB files
rdbcompression yes

# RDB checksum
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory for persistence files
dir /data

# ============================================================
# PERFORMANCE TUNING
# ============================================================
# Disable Lua script time limit warning for short scripts
lua-time-limit 5000

# Lazy free settings for async memory reclamation
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
